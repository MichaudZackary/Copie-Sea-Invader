<h1>ScoreBoard</h1>

<!-- Rappel : tr = ligne; td = colonne -->
<a href="./ajouter/">Ajouter un nouveau joueur</a>
<table>
    <tr>
        <td><b>Index</b></td>
        <td><b>User</b></td>
        <td><b>Score</b></td>
        <td><b>Wave</b></td>
    </tr>
{% for User in liste_contacts %}
    <tr>
        <td>{{User[0]}}</td>
        <td>{{User[1]}}</td>
        <td>{{User[2]}}</td>
        <td>{{User[3]}}</td>
    </tr>
{% endfor %}
</table>
